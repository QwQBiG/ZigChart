<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <meta name="description" content="ZigChart: a portable chart core, built for the open web. Explore a reproducible synthetic market replay." />
    <title>ZigChart · Market workspace</title>
  </head>
  <body>
    <div class="workspace">
      <header class="app-header">
        <a class="brand" href="./" aria-label="ZigChart home" data-i18n-aria-label="brandHome"><span class="brand-mark" aria-hidden="true">Z</span></a>
        <button id="symbol-open" class="instrument-heading quiet-button" type="button" aria-haspopup="dialog" title="Search symbols" aria-label="Search symbols" disabled><strong id="active-symbol">ZIG/USD</strong><span class="small-tag" data-i18n="sampleTag">SAMPLE</span></button>
        <label class="period-control"><span class="visually-hidden" data-i18n="periodLabel">Period</span><select id="period-select" aria-label="Period" data-i18n-aria-label="periodLabel" disabled><option value="minute-1">1m</option></select></label>
        <label class="series-type-control"><span class="visually-hidden" data-i18n="seriesType">Chart type</span><select id="series-type-select" aria-label="Chart type" data-i18n-aria-label="seriesType"></select></label>
        <div class="primary-tools">
          <button id="analysis-open" type="button" class="quiet-button analysis-trigger" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V9m6 9V5m6 13v-7m6 7V3M3 7l6-4 6 6 6-8"/></svg><span data-i18n="analysisLibrary">Indicators & scripts</span></button>
          <button id="header-replay" type="button" class="quiet-button" disabled><span id="header-replay-icon" aria-hidden="true">▶</span><span id="header-replay-label" data-i18n="replay">Replay</span></button>
          <button id="edit-undo" class="icon-button" type="button" title="Undo" aria-label="Undo" data-i18n-title="undo" data-i18n-aria-label="undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l-5 5 5 5M3 11h11a6 6 0 016 6"/></svg></button>
          <button id="edit-redo" class="icon-button" type="button" title="Redo" aria-label="Redo" data-i18n-title="redo" data-i18n-aria-label="redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6l5 5-5 5m5-5H10a6 6 0 00-6 6"/></svg></button>
        </div>
        <div class="header-tools">
          <button id="chart-fullscreen" type="button" class="icon-button" aria-pressed="false" title="Enter fullscreen" aria-label="Enter fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
          <button id="chart-save-image" type="button" class="icon-button" title="Save chart image" aria-label="Save chart image" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l2-2h4l2 2h5v15H3V5z"/><circle cx="12" cy="12" r="4"/></svg></button>
          <button id="sidebar-toggle" type="button" class="icon-button" aria-controls="market-sidebar" aria-expanded="true" title="Toggle details" aria-label="Toggle details" data-i18n-title="sidebarToggle" data-i18n-aria-label="sidebarToggle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
          <label class="language-control"><span data-i18n="languageLabel">Language</span><select id="language-select" aria-label="Language" data-i18n-aria-label="languageLabel"><option value="en" lang="en">English</option><option value="zh-CN" lang="zh-CN">简体中文</option></select></label>
        </div>
      </header>
      <div id="fullscreen-status" class="workspace-notice" role="status" hidden></div>
      <main>
        <div class="desk">
          <nav class="drawing-toolbar" aria-label="Chart tools" data-i18n-aria-label="workspaceTools">
            <button class="tool-button active" type="button" data-tool="pointer" aria-pressed="true" title="Select or pan" aria-label="Select or pan" data-i18n-title="pointerTool" data-i18n-aria-label="pointerTool"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 9-7 2-3 7z"/></svg></button>
            <span class="line-tools"><select id="line-tool-select" aria-label="Lines" disabled><option value="">Lines</option></select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M3 17l4 4M17 3l4 4"/></svg></span>
            <button class="tool-button" type="button" data-tool="rectangle" aria-pressed="false" title="Rectangle" aria-label="Rectangle" data-i18n-title="rectangleTool" data-i18n-aria-label="rectangleTool" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14"/><path d="M2 5h4M4 3v4M18 19h4M20 17v4"/></svg></button>
            <button id="measure-tool" class="tool-button" type="button" aria-pressed="false" title="Measure price and time (Shift + click)" aria-label="Measure price and time (Shift + click)" data-i18n-title="measureTool" data-i18n-aria-label="measureTool" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16L16 3l5 5L8 21zM6 13l3 3M10 9l3 3M14 5l3 3"/></svg></button>
            <button class="tool-button" type="button" data-tool="text" aria-pressed="false" title="Text" aria-label="Text" data-i18n-title="textTool" data-i18n-aria-label="textTool" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M8 20h8"/></svg></button>
            <span class="tool-divider"></span>
            <button id="crosshair-settings-open" class="tool-button" type="button" aria-haspopup="dialog" aria-controls="crosshair-dialog" aria-expanded="false" title="Crosshair settings" aria-label="Crosshair settings" data-i18n-title="crosshairSettings" data-i18n-aria-label="crosshairSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v7m0 6v7M2 12h7m6 0h7"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button id="drawing-settings-open" class="tool-button" type="button" aria-haspopup="dialog" title="Drawing objects and style" aria-label="Drawing objects and style" data-i18n-title="drawingSettings" data-i18n-aria-label="drawingSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></button>
            <button id="drawing-delete" class="tool-button" type="button" title="Delete selected drawing" aria-label="Delete selected drawing" data-i18n-title="deleteDrawing" data-i18n-aria-label="deleteDrawing" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button>
          </nav>
          <section class="chart-panel" aria-label="Market chart" data-i18n-aria-label="marketChart">
            <div id="chart-container" class="chart-container">
              <canvas id="chart" tabindex="0" role="img" aria-label="Market chart. Drag to pan, scroll to zoom. Use arrow keys to pan, plus and minus to zoom, and End to return to the latest candle." data-i18n-aria-label="chartAria"></canvas>
              <canvas id="chart-overlay-canvas" aria-hidden="true"></canvas>
              <div class="chart-overlay">
                <div class="chart-identity-row">
                  <h1><button id="series-select" class="series-select" type="button" aria-pressed="false" data-i18n-title="selectSeries" title="Select candle series"><span id="instrument-description">Synthetic ZIG / USD</span><span aria-hidden="true"> · </span><span id="active-period">1 min</span></button></h1>
                  <div id="ohlc" class="ohlc" aria-label="Selected candle" data-i18n-aria-label="selectedCandle"><span>O <b>—</b></span><span>H <b>—</b></span><span>L <b>—</b></span><span>C <b>—</b></span></div>
                </div>
                <div id="period-description" class="chart-source" data-i18n="sampleCalendar">Synthetic · UTC · 24/7</div>
                <div id="indicator-controls" class="indicator-controls" aria-label="Visible indicators" data-i18n-aria-label="visibleIndicators" hidden></div>
              </div>
              <div id="volume-legend" class="volume-legend" hidden></div>
              <div id="pane-resizer" class="pane-resizer" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize chart panes" aria-valuemin="30" aria-valuemax="85" aria-valuenow="74" hidden></div>
              <div id="chart-empty" class="chart-empty"><span class="loading-ring"></span><strong>Preparing your workspace</strong><span>Loading the chart core and sample history…</span></div>
              <div id="chart-tooltip" class="chart-tooltip" hidden></div>
              <div id="series-selection-hint" class="series-selection-hint" role="status" hidden></div>
              <button id="price-scale-auto" class="price-scale-auto" type="button" aria-pressed="true" disabled>Auto</button>
              <button id="price-scale-mode" class="price-scale-auto price-scale-mode" type="button" aria-haspopup="dialog" disabled>Price</button>
            </div>
            <div class="chart-bottom"><div class="chart-actions"><button id="load-history" class="quiet-button" type="button" title="Load 500 older candles" data-i18n-title="historyTitle">← Older history</button><button id="go-latest" class="quiet-button" type="button" title="Return to the newest candle (End)" data-i18n="latest" data-i18n-title="latestTitle">Latest ↗</button></div><span><span class="tiny-dot"></span><span id="chart-status">INITIALIZING</span></span><span id="selected-time">All times in UTC</span><span id="render-time">Canvas 2D</span></div>
            <div id="error-message" class="error-message" role="alert" hidden></div>
          </section>
          <div id="sidebar-resizer" class="sidebar-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize details panel" aria-controls="market-sidebar" aria-valuemin="220" aria-valuemax="560" aria-valuenow="264"></div>
          <aside id="market-sidebar" class="market-sidebar" aria-label="Watchlist and instrument information" data-i18n-aria-label="sidebarAria"></aside>
        </div>
      </main>
    </div>
    <dialog id="drawing-panel" class="drawing-dialog" aria-labelledby="drawing-heading">
            <section class="drawing-card" aria-labelledby="drawing-heading">
              <div class="section-title"><h2 id="drawing-heading" data-i18n="drawingStyle">Drawing style</h2></div>
              <div class="settings-fields">
                <label><span data-i18n="drawingObjects">Objects</span><select id="drawing-list"><option value="" data-i18n="noDrawingSelected">No drawing selected</option></select></label>
                <label><span data-i18n="drawingColor">Drawing color</span><input id="drawing-color" type="color" value="#5b9cf6" /></label>
                <label><span data-i18n="drawingWidth">Drawing width</span><select id="drawing-width"><option value="1">1 px</option><option value="2" selected>2 px</option><option value="3">3 px</option><option value="4">4 px</option></select></label>
              </div>
              <p id="drawing-hint" class="settings-hint">Select an object to edit. Esc cancels; Delete removes it.</p>
              <button id="drawing-lock" class="quiet-button" type="button" aria-pressed="false" disabled>Lock selected drawing</button>
              <button id="drawing-settings-delete" class="quiet-button" type="button" data-i18n="deleteDrawing" disabled>Delete selected drawing</button>
              <p id="drawing-status" class="settings-hint" role="status"></p>
            </section>
      <footer class="drawing-dialog-footer"><button id="drawing-settings-close" type="button" class="quiet-button" data-i18n="closePanel">Close</button></footer>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
